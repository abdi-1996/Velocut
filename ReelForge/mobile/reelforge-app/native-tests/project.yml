name: ReelRendererTests
options:
  deploymentTarget:
    iOS: '16.4'
settings:
  base:
    SWIFT_VERSION: '5.9'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  RendererHost:
    type: application
    platform: iOS
    sources:
      - path: Host.swift
      - path: ../modules/reel-renderer/ios/ReelEngine.swift
      - path: ../modules/reel-renderer/ios/ReelVideoCompositor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdi.reelforge.tests.host
  RendererTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RendererTests.swift
    dependencies:
      - target: RendererHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdi.reelforge.tests
schemes:
  RendererTests:
    build:
      targets:
        RendererHost: all
        RendererTests: [test]
    test:
      targets: [RendererTests]
